# XenonRecomp configuration for Peggle 2 (XBLA, title 58411436).
# Paths are relative to this file.

[main]
file_path = "../game/Default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "peggle2_switch_tables.toml"

# Optimisations stay off until the game actually runs (per XenonRecomp's advice).
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers, located by byte pattern with tools/xexdump.
restgprlr_14_address = 0x825F0A80
savegprlr_14_address = 0x825F0A30
restfpr_14_address = 0x825F140C
savefpr_14_address = 0x825F13C0
restvmx_14_address = 0x825F2188
savevmx_14_address = 0x825F1EF0
restvmx_64_address = 0x825F221C
savevmx_64_address = 0x825F1F84

# TODO: longjmp_address / setjmp_address once located (look near RtlUnwind callers).

# @FUNCTIONS@  (replaced by tools/gen_config.py with config/peggle2_functions.toml)

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    # 8-byte exception records (handler ptr + handler data ptr) that precede
    # functions with the pdata exception flag. Found with a pdata gap survey.
    { data = 0x825F2878, size = 8 }, # C++ frame handler (2137 functions)
    { data = 0x8288447C, size = 8 }, # Second frame handler (74 functions)
]
